<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UK Local Authority Wards &amp; Councillors Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
        :root {
            --header-bg: #002D62;
            --surface: #ffffff;
            --muted: #667085;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            color: #1a1a1a;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #viewer-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #combined-map-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #combined-map {
            width: 100%;
            height: 100%;
        }
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            gap: 12px;
            font-size: 0.95rem;
            color: var(--muted);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #d0d5dd;
            border-top-color: var(--header-bg);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .leaflet-tooltip.info-tooltip {
            background: var(--surface);
            border: none;
            border-radius: 10px;
            padding: 0;
            box-shadow: var(--shadow);
            font-size: 13px;
            max-width: 300px;
            line-height: 1.35;
            white-space: normal;
        }
        .tooltip-inner { padding: 12px 14px; }
        .tooltip-inner h4 {
            margin: 0 0 8px;
            color: var(--header-bg);
            font-size: 14px;
            font-weight: 600;
            border-bottom: 2px solid var(--header-bg);
            padding-bottom: 4px;
        }
        .cllr-list { margin: 0; padding: 0; list-style: none; }
        .cllr-list li { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .cllr-photo, .cllr-photo-placeholder { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; object-fit: cover; background: #e8ecf0; border: 1px solid #d0d5dd; }
        .cllr-photo-placeholder { display: flex; align-items: center; justify-content: center; color: #98a2b3; font-size: 14px; font-weight: 600; }
        .cllr-text { min-width: 0; }
        .cllr-text strong { display: block; font-size: 13px; }
        .party { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
        .party-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

        #council-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 280px;
            max-height: calc(100% - 32px);
            overflow: auto;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 1500;
            display: none;
        }
        #council-panel.open { display: block; }
        #council-panel header {
            background: var(--header-bg);
            color: #fff;
            padding: 12px 14px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        #council-panel header h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            flex: 1;
        }
        #council-panel header button {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        #council-panel .control {
            margin: 12px 14px 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--header-bg);
        }
        #council-panel .meta {
            margin: 0 14px 10px;
            font-size: 12px;
            color: var(--muted);
        }
        #council-panel ul { list-style: none; margin: 0; padding: 0 14px 14px; }
        #council-panel li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-top: 1px solid #eef0f3;
            font-size: 13px;
        }
        #council-panel li .count { margin-left: auto; font-weight: 600; }
        #council-panel .bar {
            height: 6px;
            border-radius: 3px;
            background: #eef0f3;
            flex: 1;
            overflow: hidden;
        }
        #council-panel .bar span { display: block; height: 100%; }

        #view-toggle {
            position: absolute;
            top: 16px;
            left: 56px;
            z-index: 1500;
            display: flex;
            background: var(--surface);
            border-radius: 10px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        #view-toggle button {
            border: none;
            background: transparent;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
        }
        #view-toggle button.active {
            background: var(--header-bg);
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <div id="combined-map-container">
            <div id="combined-map"></div>
            <div id="view-toggle">
                <button type="button" id="view-wards">Wards</button>
                <button type="button" id="view-councils" class="active">Councils</button>
            </div>
            <aside id="council-panel">
                <header>

                    <button type="button" id="council-panel-close" aria-label="Close">&times;</button>

                <div class="control" id="council-panel-control"></div>
                <div class="meta" id="council-panel-meta"></div>
                <ul id="council-panel-parties"></ul>
            </aside>
            <div id="loading-overlay">
                <div class="spinner"></div>
                <p id="loading-text">Loading nationwide boundaries...</p>
            </div>
        </div>
    </div>

        function nameKey(name) {
            return String(name || "").toLowerCase()
                .replace(/['’`]/g, "")
                .replace(/\b(and|amp)\b/g, " ")
                .replace(/[^a-z0-9]+/g, " ")
                .trim();
        }

        function partyColour(party) {
            if (!party) return MIXED_COLOUR;
            for (const p of PARTY_COLOURS) {
                if (p.match.test(party)) return p.colour;
            }
            return MIXED_COLOUR;
        }

        function normaliseParty(party) {
            if (!party) return "";
            if (/\bsdlp\b|social democratic and labour/i.test(party)) return "SDLP";
            if (/labour/i.test(party)) return "Labour";
            return String(party).trim();
        }

        function councilColour(name) {
            const official = COMPOSITION[nameKey(name)];
            if (official && official.control && !/^null$/i.test(official.control.trim())) {
                const lead = official.control.split("/")[0].trim();
                if (lead && !/no overall/i.test(lead)) return partyColour(lead);
            }
            const summary = councilSummary(name);
            return summary.rows[0] ? partyColour(summary.rows[0][0]) : MIXED_COLOUR;
        }

        function fillColour(councillors) {
            const list = (councillors || []).map(normaliseCouncillor);
            const parties = new Set(list.map(c => normaliseParty(c.party)).filter(Boolean));
            if (parties.size === 1) {
                return partyColour([...parties][0]);
            }
            return MIXED_COLOUR;
        }

        function escapeHtml(str) {
            return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function normaliseCouncillor(c) {
            if (Array.isArray(c)) {
                return { name: c[0] || "", party: c[1] || "", photo: c[2] || null };
            }
            return {
                name: c.name || c.Name || "",
                party: c.party || c.Party || "",
                photo: c.photo || c.Photo || null,
            };
        }

        function councillorListHtml(councillors) {
            const list = (councillors || []).map(normaliseCouncillor);
            if (!list.length) return "<li>No councillor data</li>";
            return list.map(c => {
                const initial = c.name ? c.name.trim().charAt(0).toUpperCase() : "?";
                const colour = partyColour(c.party);
                let avatar = c.photo ? 
                    `<img class="cllr-photo" src="${escapeHtml(c.photo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="cllr-photo-placeholder" style="display:none">${escapeHtml(initial)}</div>` :
                    `<div class="cllr-photo-placeholder">${escapeHtml(initial)}</div>`;
                return `<li>${avatar}<div class="cllr-text"><strong>${escapeHtml(c.name)}</strong><span class="party"><span class="party-dot" style="background:${colour}"></span>${escapeHtml(c.party)}</span></div></li>`;
            }).join("");
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        let combinedFeatures = [];

        function councilSummary(councilName) {
            const counts = new Map();
            let total = 0;
            let wards = 0;
            const want = nameKey(councilName);
            for (const f of combinedFeatures) {
                const got = nameKey(f.properties?.councilName || "");
                if (got !== want) continue;
                wards += 1;
                for (const c of (f.properties?.councillors || [])) {
                    const party = normaliseParty(normaliseCouncillor(c).party) || "Unknown";
                    counts.set(party, (counts.get(party) || 0) + 1);
                    total += 1;
                }
            }
            const rows = [...counts.entries()].sort((a, b) => b[1] - a[1]);
            const top = rows[0];
            let control = "No overall control";
            if (top && top[1] > total / 2) control = top[0] + " control";
            else if (top) control = top[0] + " plurality";
            return { rows, total, wards, control };
        }

        function showCouncil(councilName) {
            const panel = document.getElementById("council-panel");
            const official = COMPOSITION[nameKey(councilName)];
            const usable = official && official.control && !/^null$/i.test(official.control.trim());
            document.getElementById("council-panel-title").textContent = councilName || "Council";
            if (usable) {
                document.getElementById("council-panel-control").textContent = official.control || "No overall control";
                document.getElementById("council-panel-meta").textContent = official.total + " councillors";
                const list = document.getElementById("council-panel-parties");
                list.innerHTML = (official.seats || []).map(s => {
                    const colour = partyColour(s.party);
                    const pct = official.total ? Math.round(100 * s.count / official.total) : 0;
                    return `<li><span class="party-dot" style="background:${colour}"></span><span>${escapeHtml(s.party)}</span><span class="bar"><span style="width:${pct}%;background:${colour}"></span></span><span class="count">${s.count}</span></li>`;
                }).join("") || "<li>No composition data</li>";
            } else {
                const summary = councilSummary(councilName);
                document.getElementById("council-panel-control").textContent = summary.control;
                document.getElementById("council-panel-meta").textContent =
                    summary.total + " councillors across " + summary.wards + " wards";
                const list = document.getElementById("council-panel-parties");
                list.innerHTML = summary.rows.map(([party, n]) => {
                    const colour = partyColour(party);
                    const pct = summary.total ? Math.round(100 * n / summary.total) : 0;
                    return `<li><span class="party-dot" style="background:${colour}"></span><span>${escapeHtml(party)}</span><span class="bar"><span style="width:${pct}%;background:${colour}"></span></span><span class="count">${n}</span></li>`;
                }).join("") || "<li>No councillor data</li>";
            }
            panel.classList.add("open");
        }

        document.getElementById("council-panel-close").addEventListener("click", () => {
            document.getElementById("council-panel").classList.remove("open");
        });

        window.addEventListener("DOMContentLoaded", async () => {
            const loadingText = document.getElementById("loading-text");
            const loadingOverlay = document.getElementById("loading-overlay");

            const map = L.map("combined-map", { renderer: L.canvas() }).setView([54.5, -3.2], 6);
            L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_4jfy_1_9fde7a09e3062db9638d58fd", {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            combinedFeatures = [];
            try {
                for (let i = 0; i < PART_FILES.length; i++) {
                    loadingText.textContent = `Loading chunk ${i + 1} of ${PART_FILES.length}...`;
                    await loadScript(PART_FILES[i]);
                    const partData = window[`WARD_PART_${i + 1}`];
                    if (partData && partData.features) {
                        combinedFeatures.push(...partData.features);
                    }
                }
                await loadScript("data/council_outlines.js");
            } catch (e) {
                console.error("Failed loading data chunks:", e);
                loadingText.textContent = "Error loading map chunks. Check console.";
                return;
            }

            if (combinedFeatures.length > 0) {
                const geoLayer = L.geoJSON({ type: "FeatureCollection", features: combinedFeatures }, {
                    style: (feature) => ({
                        fillColor: fillColour(feature.properties?.councillors),
                        weight: 1,
                        opacity: 1,
                        color: "#ffffff",
                        fillOpacity: 0.6
                    }),
                    onEachFeature: (feature, layer) => {
                        const p = feature.properties || {};
                        const wName = p.WD25NM || p.ward || "Ward";
                        layer.bindTooltip(
                            `<div class="tooltip-inner"><h4>${escapeHtml(wName)} (${escapeHtml(p.councilName || "")})</h4><ul class="cllr-list">${councillorListHtml(p.councillors)}</ul></div>`,
                            { direction: "auto", sticky: true, className: "info-tooltip" }
                        );
                        layer.on({
                            mouseover: (e) => {
                                e.target.setStyle({ weight: 2, color: "#002D62", fillOpacity: 0.85 });
                            },
                            mouseout: (e) => geoLayer.resetStyle(e.target),
                            click: () => showCouncil(p.councilName || "")
                        });
                    }
                }).addTo(map);

                let councilLayer = null;
                if (window.COUNCIL_OUTLINES && window.COUNCIL_OUTLINES.features) {
                    const outlineLayer = L.geoJSON(window.COUNCIL_OUTLINES, {
                        style: { color: "#ffffff", weight: 2.5, opacity: 1, fillOpacity: 0 },
                        interactive: false
                    }).addTo(map);
                    outlineLayer.bringToFront();

                    councilLayer = L.geoJSON(window.COUNCIL_OUTLINES, {
                        style: (feature) => ({
                            fillColor: councilColour(feature.properties?.councilName),
                            weight: 1.5,
                            color: "#ffffff",
                            fillOpacity: 0.7
                        }),
                        onEachFeature: (feature, layer) => {
                            const name = feature.properties?.councilName || "Council";
                            layer.bindTooltip(
                                `<div class="tooltip-inner"><h4>${escapeHtml(name)}</h4></div>`,
                                { direction: "auto", sticky: true, className: "info-tooltip" }
                            );
                            layer.on({
                                mouseover: (e) => e.target.setStyle({ weight: 2.5, color: "#002D62", fillOpacity: 0.9 }),
                                mouseout: (e) => councilLayer.resetStyle(e.target),
                                click: (e) => {
                                    L.DomEvent.stopPropagation(e);
                                    showCouncilWards(name);
                                }
                            });
                        }
                    });
                }

                function showCouncilWards(name) {
                    const wanted = (name || "").toLowerCase();
                    const features = combinedFeatures.filter(
                        f => (f.properties?.councilName || "").toLowerCase() === wanted
                    );
                    if (!features.length) return;
                    if (map.hasLayer(councilLayer)) map.removeLayer(councilLayer);
                    if (map.hasLayer(geoLayer)) map.removeLayer(geoLayer);
                    const one = L.geoJSON({ type: "FeatureCollection", features }, {
                        style: (feature) => ({
                            fillColor: fillColour(feature.properties?.councillors),
                            weight: 1, opacity: 1, color: "#ffffff", fillOpacity: 0.7
                        }),
                        onEachFeature: (feature, layer) => {
                            const p = feature.properties || {};
                            layer.bindTooltip(
                                `<div class="tooltip-inner"><h4>${escapeHtml(p.WD25NM || p.ward || "Ward")}</h4><ul class="cllr-list">${councillorListHtml(p.councillors)}</ul></div>`,
                                { direction: "auto", sticky: true, className: "info-tooltip" }
                            );
                            layer.on("click", (e) => {
                                L.DomEvent.stopPropagation(e);
                                showCouncil(name);
                            });
                        }
                    }).addTo(map);
                    document.getElementById("view-wards").classList.add("active");
                    document.getElementById("view-councils").classList.remove("active");
                    map.fitBounds(one.getBounds(), { padding: [30, 30] });
                    showCouncil(name);
                    map._singleCouncil = one;
                }
                function setView(mode, keepZoom) {
                    if (map._singleCouncil) {
                        map.removeLayer(map._singleCouncil);
                        map._singleCouncil = null;
                    }
                    document.getElementById("view-wards").classList.toggle("active", mode === "wards");
                    document.getElementById("view-councils").classList.toggle("active", mode === "councils");
                    if (mode === "councils" && councilLayer) {
                        map.removeLayer(geoLayer);
                        councilLayer.addTo(map);
                        if (!keepZoom) map.fitBounds(councilLayer.getBounds(), { padding: [20, 20] });
                    } else {
                        if (councilLayer) map.removeLayer(councilLayer);
                        geoLayer.addTo(map);
                        if (!keepZoom) map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });
                    }
                }
                map.on("click", () => {
                    if (map._singleCouncil) setView("councils", true);
                });
                document.getElementById("view-wards").addEventListener("click", () => setView("wards", true));
                document.getElementById("view-councils").addEventListener("click", () => setView("councils", true));
                setView(councilLayer ? "councils" : "wards");
            }

            loadingOverlay.style.display = "none";
            map.invalidateSize();
        });
    </script>
</body>

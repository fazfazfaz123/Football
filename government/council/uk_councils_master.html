<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UK Local Authority Wards &amp; Councillors Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
        :root {
            --header-bg: #002D62;
            --surface: #ffffff;
            --muted: #667085;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            color: #1a1a1a;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #viewer-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #combined-map-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #combined-map {
            width: 100%;
            height: 100%;
        }
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            gap: 12px;
            font-size: 0.95rem;
            color: var(--muted);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #d0d5dd;
            border-top-color: var(--header-bg);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .leaflet-tooltip.info-tooltip {
            background: var(--surface);
            border: none;
            border-radius: 10px;
            padding: 0;
            box-shadow: var(--shadow);
            font-size: 13px;
            max-width: 300px;
            line-height: 1.35;
            white-space: normal;
        }
        .tooltip-inner { padding: 12px 14px; }
        .tooltip-inner h4 {
            margin: 0 0 8px;
            color: var(--header-bg);
            font-size: 14px;
            font-weight: 600;
            border-bottom: 2px solid var(--header-bg);
            padding-bottom: 4px;
        }
        .cllr-list { margin: 0; padding: 0; list-style: none; }
        .cllr-list li { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .cllr-photo, .cllr-photo-placeholder { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; object-fit: cover; background: #e8ecf0; border: 1px solid #d0d5dd; }
        .cllr-photo-placeholder { display: flex; align-items: center; justify-content: center; color: #98a2b3; font-size: 14px; font-weight: 600; }
        .cllr-text { min-width: 0; }
        .cllr-text strong { display: block; font-size: 13px; }
        .party { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
        .party-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="viewer-container">
        <div id="combined-map-container">
            <div id="combined-map"></div>
            <div id="loading-overlay">
                <div class="spinner"></div>
                <p id="loading-text">Loading nationwide boundaries...</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const PART_FILES = ["data/combined_wards_part_1.js", "data/combined_wards_part_2.js", "data/combined_wards_part_3.js", "data/combined_wards_part_4.js", "data/combined_wards_part_5.js", "data/combined_wards_part_6.js", "data/combined_wards_part_7.js", "data/combined_wards_part_8.js"];

        const PARTY_COLOURS = [
            { match: /labour/i, colour: "#E4003B" },
            { match: /conservative/i, colour: "#0087DC" },
            { match: /liberal democrat/i, colour: "#FAA61A" },
            { match: /\breform\b/i, colour: "#12B6CF" },
            { match: /green/i, colour: "#6AB023" },
            { match: /scottish national party|\bsnp\b/i, colour: "#FDF357" },
            { match: /plaid cymru/i, colour: "#005B54" },
            { match: /sinn f&eacute;in|sinn fein/i, colour: "#326760" },
            { match: /democratic unionist party|\bdup\b/i, colour: "#D46A4C" },
            { match: /alliance party|\balliance\b/i, colour: "#F6CB2F" },
            { match: /social democratic and labour party|\bsdlp\b/i, colour: "#2AA82C" },
            { match: /ulster unionist party|\buup\b/i, colour: "#4F5D73" },
            { match: /traditional unionist voice|\btuv\b/i, colour: "#0D5EAF" },
            { match: /\baspire\b/i, colour: "#7B2D8E" },
            { match: /independent|oldham group|cpa|people'?s alliance|community campaign|local alliance/i, colour: "#9B59B6" },
            { match: /vacant/i, colour: "#B0B0B0" }
        ];
        const MIXED_COLOUR = "#808080";

        function partyColour(party) {
            if (!party) return MIXED_COLOUR;
            for (const p of PARTY_COLOURS) {
                if (p.match.test(party)) return p.colour;
            }
            return MIXED_COLOUR;
        }

        function fillColour(councillors) {
            const list = (councillors || []).map(normaliseCouncillor);
            const parties = new Set(list.map(c => c.party).filter(Boolean));
            if (parties.size === 1) {
                return partyColour([...parties][0]);
            }
            return MIXED_COLOUR;
        }

        function escapeHtml(str) {
            return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function normaliseCouncillor(c) {
            if (Array.isArray(c)) {
                return { name: c[0] || "", party: c[1] || "", photo: c[2] || null };
            }
            return {
                name: c.name || c.Name || "",
                party: c.party || c.Party || "",
                photo: c.photo || c.Photo || null,
            };
        }

        function councillorListHtml(councillors) {
            const list = (councillors || []).map(normaliseCouncillor);
            if (!list.length) return "<li>No councillor data</li>";
            return list.map(c => {
                const initial = c.name ? c.name.trim().charAt(0).toUpperCase() : "?";
                const colour = partyColour(c.party);
                let avatar = c.photo ? 
                    `<img class="cllr-photo" src="${escapeHtml(c.photo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="cllr-photo-placeholder" style="display:none">${escapeHtml(initial)}</div>` :
                    `<div class="cllr-photo-placeholder">${escapeHtml(initial)}</div>`;
                return `<li>${avatar}<div class="cllr-text"><strong>${escapeHtml(c.name)}</strong><span class="party"><span class="party-dot" style="background:${colour}"></span>${escapeHtml(c.party)}</span></div></li>`;
            }).join("");
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        window.addEventListener("DOMContentLoaded", async () => {
            const loadingText = document.getElementById("loading-text");
            const loadingOverlay = document.getElementById("loading-overlay");

            const map = L.map("combined-map", { renderer: L.canvas() }).setView([54.5, -3.2], 6);
            L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_4jfy_1_9fde7a09e3062db9638d58fd", {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            let combinedFeatures = [];
            try {
                for (let i = 0; i < PART_FILES.length; i++) {
                    loadingText.textContent = `Loading chunk ${i + 1} of ${PART_FILES.length}...`;
                    await loadScript(PART_FILES[i]);
                    const partData = window[`WARD_PART_${i + 1}`];
                    if (partData && partData.features) {
                        combinedFeatures.push(...partData.features);
                    }
                }
            } catch (e) {
                console.error("Failed loading data chunks:", e);
                loadingText.textContent = "Error loading map chunks. Check console.";
                return;
            }

            if (combinedFeatures.length > 0) {
                const geoLayer = L.geoJSON({ type: "FeatureCollection", features: combinedFeatures }, {
                    style: (feature) => ({
                        fillColor: fillColour(feature.properties?.councillors),
                        weight: 1,
                        opacity: 1,
                        color: "#ffffff",
                        fillOpacity: 0.6
                    }),
                    onEachFeature: (feature, layer) => {
                        const p = feature.properties || {};
                        const wName = p.WD25NM || p.ward || "Ward";
                        layer.bindTooltip(
                            `<div class="tooltip-inner"><h4>${escapeHtml(wName)} (${escapeHtml(p.councilName || "")})</h4><ul class="cllr-list">${councillorListHtml(p.councillors)}</ul></div>`,
                            { direction: "auto", sticky: true, className: "info-tooltip" }
                        );
                        layer.on({
                            mouseover: (e) => {
                                e.target.setStyle({ weight: 2, color: "#002D62", fillOpacity: 0.85 });
                                if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) e.target.bringToFront();
                            },
                            mouseout: (e) => geoLayer.resetStyle(e.target)
                        });
                    }
                }).addTo(map);

                map.fitBounds(geoLayer.getBounds());
            }

            loadingOverlay.style.display = "none";
            map.invalidateSize();
        });
    </script>
</body>
</html>

    <style>
        :root {
            --header-bg: #002D62;
            --header-fg: #fff;
            --accent: #002D62;
            --surface: #ffffff;
            --muted: #667085;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            color: #1a1a1a;
        }
        #header {
            background: var(--header-bg);
            color: var(--header-fg);
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            position: relative;
            z-index: 1000;
        }
        #header .titles { flex: 1 1 auto; min-width: 180px; }
        #header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        #header p {
            margin: 2px 0 0;
            font-size: 0.8rem;
            opacity: 0.85;
        }
        #map {
            height: calc(100vh - 64px);
            width: 100%;
            background: #e8ecf0;
        }
        #loading {
            position: absolute;
            inset: 64px 0 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            z-index: 900;
            gap: 12px;
            transition: opacity 0.25s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #d0d5dd;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .leaflet-tooltip.info-tooltip {
            background: var(--surface);
            border: none;
            border-radius: 10px;
            padding: 0;
            box-shadow: var(--shadow);
            font-size: 13px;
            max-width: 300px;
            line-height: 1.35;
            white-space: normal;
        }
        .leaflet-tooltip.info-tooltip::before { border-top-color: var(--surface); }
        .tooltip-inner { padding: 12px 14px; }
        .tooltip-inner h4 {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 4px;
        }
        .cllr-list { margin: 0; padding: 0; list-style: none; }
        .cllr-list li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cllr-list li:last-child { margin-bottom: 0; }
        .cllr-photo,
        .cllr-photo-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            background: #e8ecf0;
            border: 1px solid #d0d5dd;
        }
        .cllr-photo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #98a2b3;
            font-size: 14px;
            font-weight: 600;
        }
        .cllr-text { min-width: 0; }
        .cllr-text strong { display: block; font-size: 13px; }
        .party {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }
        .party-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 0;
        }
        .leaflet-popup-content { margin: 0; min-width: 220px; }
        .popup-inner { padding: 14px 16px; }
        .popup-inner h3 {
            margin: 0 0 10px;
            font-size: 15px;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
        }
        .popup-meta {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .legend {
            background: var(--surface);
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            font-size: 12px;
            line-height: 1.65;
            min-width: 140px;
        }
        .legend-title { font-weight: 600; margin-bottom: 4px; font-size: 12px; }
        .legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            margin-top: 2px;
            opacity: 0.9;
            border-radius: 3px;
        }
        .legend .hint {
            margin-top: 6px;
            font-size: 11px;
            color: var(--muted);
            clear: both;
        }
    </style>

677729,57.0862641854155],[-2.08479729073025,57.0862863603971],[-2.08524769726069,57.0858556161186],[-2.08524886610274,57.0858544978318],[-2.08896568013041,57.0870453974319],[-2.09781111302982,57.0883296436059],[-2.11868682584187,57.0904208857227],[-2.11874726387538,57.10377341683],[-2.12198458629339,57.1084415643471],[-2.12107197349422,57.1136418375271],[-2.12458381516588,57.1136312196684],[-2.12304447891772,57.1149828755896],[-2.12316835678372,57.1160158777064],[-2.1240347887316,57.1173777305039],[-2.12607436809121,57.1184105271053],[-2.12441581585457,57.1189706103272],[-2.12433884260704,57.1189256173787],[-2.12429405386401,57.1188994364141],[-2.12390783260481,57.1186736754486],[-2.12288942429698,57.1190676826932],[-2.1179671125697,57.1225995713462],[-2.11687864487228,57.1249460377934],[-2.11530048553827,57.1265446476619],[-2.11367861675902,57.1276635827863],[-2.11311711042311,57.1276914778502],[-2.11477883156985,57.1266358446014],[-2.11593819364606,57.125420028215],[-2.11448913472202,57.126693145963],[-2.11175799700558,57.1280582781547],[-2.10954676797752,57.1282191853873],[-2.10354879815022,57.1271068619434],[-2.09836458854045,57.1283033351731],[-2.09575832102596,57.1297708357572],[-2.09570444325194,57.1298427250875],[-2.09296749294588,57.1286412190721],[-2.0890235555342,57.1281661742574],[-2.08645230233623,57.1283899001086],[-2.07352063176749,57.1308075222131],[-2.068354462957,57.1312533114359],[-2.05958224377543,57.1308248794533],[-2.05746261120652,57.1307914799717]]]},"properties":{"FID":7347,"WD25CD":"S13002847","WD25NM":"Kincorth/Nigg/Cove","WD25NMW":" ","LAD25CD":"S12000033","LAD25NM":"Aberdeen City","BNG_E":394820,"BNG_N":801834,"LONG":-2.087157,"LAT":57.10742,"Shape__Area":14997206.404541016,"Shape__Length":23106.14072490232,"GlobalID":"1bb97bc3-86b0-4d4d-b707-a789332fc014"}}]};
    const COUNCILLORS_BY_WARD = {"Dyce/Bucksburn/Danestone":[],"Bridge of Don":[],"Kingswells/Sheddocksley/Summerhill":[],"Northfield/Mastrick North":[],"Hilton/Woodside/Stockethill":[],"Tillydrone/Seaton/Old Aberdeen":[],"Midstocket/Rosemount":[],"George St/Harbour":[],"Lower Deeside":[],"Hazlehead/Queens Cross/Countesswells":[],"Airyhall/Broomhill/Garthdee":[],"Torry/Ferryhill":[],"Kincorth/Nigg/Cove":[]};

    const PARTY_COLOURS = [
        { match: /labour/i, colour: "#e81b23", label: "Labour" },
        { match: /green/i, colour: "#6ab023", label: "Green" },
        { match: /liberal democrat/i, colour: "#faa61a", label: "Liberal Democrats" },
        { match: /conservative/i, colour: "#0087dc", label: "Conservative" },
        { match: /snp/i, colour: "#fdf38e", label: "SNP" },
        { match: /reform/i, colour: "#12b6cf", label: "Reform" },
        { match: /independent|oldham group/i, colour: "#9b59b6", label: "Independent" },
    ];
    const MIXED_COLOUR = "#808080";

    function partyColour(party) {
        if (!party) return MIXED_COLOUR;
        for (const p of PARTY_COLOURS) {
            if (p.match.test(party)) return p.colour;
        }
        return MIXED_COLOUR;
    }

    function fillColour(councillors) {
        const parties = new Set(
            (councillors || [])
                .map(c => (Array.isArray(c) ? c[1] : c.party) || "")
                .filter(Boolean)
        );
        if (parties.size === 1) return partyColour([...parties][0]);
        return MIXED_COLOUR;
    }

    function escapeHtml(str) {
        return String(str ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function robustNormalise(name) {
        if (!name) return "";
        let decoded = name.replace(/&amp;/g, '&').replace(/&/g, '&');
        let cleaned = decoded.replace(/\b(and|amp)\b/gi, '&');
        cleaned = cleaned.replace(/\s+ward\b/gi, '');
        let normalized = cleaned.replace(/[^a-z0-9\s]/gi, '').toLowerCase();
        return normalized.replace(/\s+/g, ' ').trim();
    }

    function normaliseCouncillor(c) {
        if (Array.isArray(c)) {
            return { name: c[0] || "", party: c[1] || "", photo: c[2] || null };
        }
        return {
            name: c.name || c.Name || "",
            party: c.party || c.Party || "",
            photo: c.photo || c.Photo || null,
        };
    }

    function councillorListHtml(councillors) {
        const list = (councillors || []).map(normaliseCouncillor);
        if (!list.length) return "<li>No data</li>";
        return list.map(c => {
            const initial = c.name ? c.name.trim().charAt(0).toUpperCase() : "?";
            const colour = partyColour(c.party);
            let avatar;
            if (c.photo) {
                avatar =
                    `<img class="cllr-photo" src="${escapeHtml(c.photo)}" alt="" loading="lazy" ` +
                    `onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` +
                    `<div class="cllr-photo-placeholder" style="display:none">${escapeHtml(initial)}</div>`;
            } else {
                avatar = `<div class="cllr-photo-placeholder">${escapeHtml(initial)}</div>`;
            }
            return (
                `<li>${avatar}<div class="cllr-text">` +
                `<strong>${escapeHtml(c.name)}</strong>` +
                `<span class="party"><span class="party-dot" style="background:${colour}"></span>${escapeHtml(c.party)}</span>` +
                `</div></li>`
            );
        }).join("");
    }

    function controlLabel(councillors) {
        const parties = new Set(
            (councillors || [])
                .map(c => normaliseCouncillor(c).party)
                .filter(Boolean)
        );
        if (parties.size === 0) return "No data";
        if (parties.size === 1) return [...parties][0];
        return "Mixed";
    }

    function matchCouncillors(wardName, byWard) {
        if (wardName in byWard) return byWard[wardName];
        const normTarget = robustNormalise(wardName);
        for (const [k, v] of Object.entries(byWard)) {
            if (k === wardName || robustNormalise(k) === normTarget) return v;
        }
        return [];
    }

    const map = L.map("map", {
        zoomControl: true,
        attributionControl: true,
        renderer: L.canvas()
    }).setView([51.545, -0.155], 13);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_4jfy_1_9fde7a09e3062db9638d58fd", {
        maxZoom: 19,
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
            '&copy; <a href="https://carto.com/attributions">CARTO</a> | Boundaries &copy; ONS / OS',
    }).addTo(map);

    let geojsonLayer = null;
    let selectedLayer = null;
    let allWardNames = [];

    function style(feature) {
        return {
            fillColor: feature.properties.fillColor || MIXED_COLOUR,
            weight: 1.5,
            opacity: 1,
            color: "#ffffff",
            fillOpacity: 0.55,
        };
    }

    function highlightStyle() {
        return { weight: 3, color: "#002D62", fillOpacity: 0.75 };
    }

    function buildTooltipHtml(props) {
        return (
            `<div class="tooltip-inner">` +
            `<h4>${escapeHtml(props.ward)} Ward</h4>` +
            `<ul class="cllr-list">${councillorListHtml(props.councillors)}</ul>` +
            `</div>`
        );
    }

    function buildPopupHtml(props) {
        const n = (props.councillors || []).length;
        return (
            `<div class="popup-inner">` +
            `<h3>${escapeHtml(props.ward)}</h3>` +
            `<div class="popup-meta">${n} councillor${n === 1 ? "" : "s"} · ${escapeHtml(controlLabel(props.councillors))}</div>` +
            `<ul class="cllr-list">${councillorListHtml(props.councillors)}</ul>` +
            `</div>`
        );
    }

    function highlightFeature(e) {
        const layer = e.target;
        if (layer === selectedLayer) return;
        layer.setStyle(highlightStyle());
        if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) layer.bringToFront();
        layer
            .bindTooltip(buildTooltipHtml(layer.feature.properties), {
                direction: "auto",
                sticky: true,
                opacity: 1,
                className: "info-tooltip",
            })
            .openTooltip();
    }

    function resetHighlight(e) {
        const layer = e.target;
        if (layer === selectedLayer) return;
        if (geojsonLayer) geojsonLayer.resetStyle(layer);
        layer.closeTooltip();
    }

    function selectWard(layer) {
        if (selectedLayer && selectedLayer !== layer) {
            geojsonLayer.resetStyle(selectedLayer);
            selectedLayer.closePopup();
        }
        selectedLayer = layer;
        layer.setStyle(highlightStyle());
        layer.bringToFront();
        layer.closeTooltip();
        layer
            .bindPopup(buildPopupHtml(layer.feature.properties), { maxWidth: 320 })
            .openPopup();
        map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 15 });
    }

    function onEachFeature(feature, layer) {
        const name = feature.properties.ward;
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: function (e) {
                L.DomEvent.stopPropagation(e);
                selectWard(layer);
            },
        });
    }

    function buildLegend(features) {
        const used = new Map();
        used.set(MIXED_COLOUR, "Mixed / Other");
        for (const f of features) {
            const cols = f.properties.councillors || [];
            const parties = new Set(cols.map(c => normaliseCouncillor(c).party).filter(Boolean));
            if (parties.size === 1) {
                const p = [...parties][0];
                const colour = partyColour(p);
                let label = p;
                for (const def of PARTY_COLOURS) {
                    if (def.match.test(p)) { label = def.label; break; }
                }
                used.set(colour, label);
            }
        }
        const order = PARTY_COLOURS.map(p => p.colour).concat(MIXED_COLOUR);
        const items = [];
        for (const colour of order) {
            if (used.has(colour)) {
                items.push(`<i style="background:${colour}"></i> ${escapeHtml(used.get(colour))}<br>`);
            }
        }
        const legend = L.control({ position: "bottomright" });
        legend.onAdd = function () {
            const div = L.DomUtil.create("div", "legend");
            div.innerHTML =
                `<div class="legend-title">Party control</div>` +
                items.join("") +
                `<div class="hint">Grey = seats shared by parties</div>`;
            return div;
        };
        legend.addTo(map);
    }

    map.on("popupclose", () => {
        if (selectedLayer) {
            geojsonLayer.resetStyle(selectedLayer);
            selectedLayer = null;
        }
    });

    const loadingEl = document.getElementById("loading");
    const features = WARD_GEO.features || [];
    for (const feat of features) {
        const props = feat.properties || {};
        const wardName = props.WD25NM || props.WD24NM || props.ward || "";
        props.ward = wardName;
        const raw = matchCouncillors(wardName, COUNCILLORS_BY_WARD);
        props.councillors = raw.map(c => {
            const n = normaliseCouncillor(c);
            return [n.name, n.party, n.photo];
        });
        props.fillColor = fillColour(props.councillors);
    }

    allWardNames = features
        .map(f => f.properties.ward)
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b));

    geojsonLayer = L.geoJSON(WARD_GEO, {
        style: style,
        onEachFeature: onEachFeature,
    }).addTo(map);

    map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
    buildLegend(features);

    loadingEl.classList.add("hidden");
    setTimeout(() => loadingEl.remove(), 300);

})();
